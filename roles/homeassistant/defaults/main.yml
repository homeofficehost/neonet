---
homeassistant_dir: "{{ ansible_env.HOME }}/homelab/homeassistant"
homeassistant_image: ghcr.io/home-assistant/home-assistant:2026.10.4
homeassistant_host: ha.home.arpa
# Integração para controlar aparelhos Tuya só pela LAN (sem nuvem)
tuya_local_version: "2026.10.0"
# Stack do Caddy que publica *.home.arpa; o HA entra na rede "caddy" dele
caddy_dir: "{{ ansible_env.HOME }}/homelab/caddy"
# Rede "caddy" do Docker: o HA aceita X-Forwarded-For só vindo dela
homeassistant_http_proxy:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/12
homeassistant_http_store_default:
  version: 2
  minor_version: 2
  key: http
  data:
    stable:
      server_port: 8123
      cors_allowed_origins: ["https://cast.home-assistant.io"]
      login_attempts_threshold: -1
      ip_ban_enabled: true
      ssl_profile: modern
      use_x_frame_options: true
      created_at: "2026-10-27T00:00:00+00:00"
      error: null
      error_message: null
    pending: null
    yaml_migration_done: true
