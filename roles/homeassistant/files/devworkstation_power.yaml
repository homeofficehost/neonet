# Consumo estimado do devworkstation: CPU (RAPL, pacote) + GPU (nvidia-smi).
# É estimativa de CPU+GPU, NÃO potência na tomada (faltam placa-mãe, RAM, discos, perdas da fonte).
command_line:
  - sensor:
      name: devworkstation CPU power
      unique_id: devworkstation_cpu_power
      # energy_uj é um contador em µJ; amostra 1 s e trata a volta do contador
      command: >-
        f=/host/powercap/intel-rapl:0/energy_uj;
        m=$(cat /host/powercap/intel-rapl:0/max_energy_range_uj);
        a=$(cat $f); sleep 1; b=$(cat $f);
        echo $(( (b - a + m) % m ))
      value_template: "{{ (value | float / 1000000) | round(1) }}"
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      scan_interval: 15
  - sensor:
      name: devworkstation GPU power
      unique_id: devworkstation_gpu_power
      # escrito pelo serviço ha-gpu-power no host
      command: cat /config/host/gpu_power
      value_template: "{{ value | float | round(1) }}"
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      scan_interval: 15

template:
  - sensor:
      - name: devworkstation CPU+GPU power
        unique_id: devworkstation_total_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {{ (states("sensor.devworkstation_cpu_power") | float(0)
              + states("sensor.devworkstation_gpu_power") | float(0)) | round(1) }}
        availability: >-
          {{ has_value("sensor.devworkstation_cpu_power") or has_value("sensor.devworkstation_gpu_power") }}

sensor:
  - platform: integration
    name: devworkstation CPU energy
    unique_id: devworkstation_cpu_energy
    source: sensor.devworkstation_cpu_power
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
  - platform: integration
    name: devworkstation GPU energy
    unique_id: devworkstation_gpu_energy
    source: sensor.devworkstation_gpu_power
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
  - platform: integration
    name: devworkstation CPU+GPU energy
    unique_id: devworkstation_total_energy
    source: sensor.devworkstation_total_power
    unit_prefix: k
    unit_time: h
    method: left
    round: 3
