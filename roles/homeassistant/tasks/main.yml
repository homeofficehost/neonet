---
- name: homeassistant | docker service enabled and running
  systemd:
    name: docker
    enabled: true
    state: started
  become: true
  tags: homeassistant

- name: homeassistant | caddy stack up (creates the "caddy" network)
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_dir }}"
    state: present
  become: true
  tags: homeassistant

- name: homeassistant | config directories
  file:
    path: "{{ homeassistant_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: ["", "config", "config/custom_components"]
  become: true
  tags: homeassistant

- name: homeassistant | compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ homeassistant_dir }}/docker-compose.yml"
    mode: "0644"
  become: true
  tags: homeassistant

- name: homeassistant | base configuration
  copy:
    dest: "{{ homeassistant_dir }}/config/configuration.yaml"
    content: "default_config:\n"
    force: false
    mode: "0644"
  become: true
  tags: homeassistant

# Automações criadas pela interface/API ficam em automations.yaml; o conteúdo é do HA, não do Ansible.
- name: homeassistant | automations file
  copy:
    dest: "{{ homeassistant_dir }}/config/automations.yaml"
    content: "[]\n"
    force: false
    mode: "0644"
  become: true
  tags: homeassistant

- name: homeassistant | include UI automations
  lineinfile:
    path: "{{ homeassistant_dir }}/config/configuration.yaml"
    line: "automation: !include automations.yaml"
  become: true
  notify: homeassistant | restart
  tags: homeassistant

# Desde o 2026.10 o HA ignora "http:" no YAML; a config fica em .storage/http.
- name: homeassistant | drop legacy http block from YAML
  blockinfile:
    path: "{{ homeassistant_dir }}/config/configuration.yaml"
    marker: "# {mark} ANSIBLE MANAGED: http"
    state: absent
  become: true
  tags: homeassistant

- name: homeassistant | stored http config
  stat:
    path: "{{ homeassistant_dir }}/config/.storage/http"
  register: ha_http_store_file
  become: true
  tags: homeassistant

- name: homeassistant | read stored http config
  slurp:
    src: "{{ homeassistant_dir }}/config/.storage/http"
  register: ha_http_store_raw
  when: ha_http_store_file.stat.exists
  become: true
  tags: homeassistant

- name: homeassistant | compute http config trusting the caddy proxy
  vars:
    current: "{{ (ha_http_store_raw.content | b64decode | from_json) if ha_http_store_file.stat.exists else homeassistant_http_store_default }}"
  set_fact:
    ha_http_store_current: "{{ current }}"
    ha_http_store_desired: >-
      {{ current | combine({'data': {
           'stable': current.data.stable | combine(homeassistant_http_proxy),
           'pending': None,
           'yaml_migration_done': true}}, recursive=true) }}
  tags: homeassistant

- name: homeassistant | write http config
  when: ha_http_store_desired != ha_http_store_current
  become: true
  tags: homeassistant
  block:
    - name: homeassistant | stop before editing storage
      community.docker.docker_compose_v2:
        project_src: "{{ homeassistant_dir }}"
        state: stopped
      when: ha_http_store_file.stat.exists

    - name: homeassistant | storage directory
      file:
        path: "{{ homeassistant_dir }}/config/.storage"
        state: directory
        mode: "0755"

    - name: homeassistant | save http config
      copy:
        dest: "{{ homeassistant_dir }}/config/.storage/http"
        content: "{{ ha_http_store_desired | to_nice_json(indent=2) }}"
        mode: "0600"

- name: homeassistant | tuya_local installed version
  stat:
    path: "{{ homeassistant_dir }}/config/custom_components/tuya_local/.version-{{ tuya_local_version }}"
  register: tuya_local_marker
  tags: homeassistant

- name: homeassistant | install tuya_local {{ tuya_local_version }}
  when: not tuya_local_marker.stat.exists
  become: true
  notify: homeassistant | restart
  tags: homeassistant
  block:
    - name: homeassistant | remove old tuya_local
      file:
        path: "{{ homeassistant_dir }}/config/custom_components/tuya_local"
        state: absent

    - name: homeassistant | tuya_local directory
      file:
        path: "{{ homeassistant_dir }}/config/custom_components/tuya_local"
        state: directory
        mode: "0755"

    - name: homeassistant | unpack tuya_local
      unarchive:
        src: "https://github.com/make-all/tuya-local/archive/refs/tags/{{ tuya_local_version }}.tar.gz"
        dest: "{{ homeassistant_dir }}/config/custom_components/tuya_local"
        remote_src: true
        extra_opts:
          - --strip-components=3
          - "tuya-local-{{ tuya_local_version }}/custom_components/tuya_local"

    - name: homeassistant | mark tuya_local version
      file:
        path: "{{ homeassistant_dir }}/config/custom_components/tuya_local/.version-{{ tuya_local_version }}"
        state: touch
        mode: "0644"

# Sensores de consumo do devworkstation (RAPL da CPU + GPU via nvidia-smi)
- name: homeassistant | packages and host directories
  file:
    path: "{{ homeassistant_dir }}/config/{{ item }}"
    state: directory
    mode: "0755"
  loop: [packages, host]
  become: true
  tags: homeassistant

- name: homeassistant | enable packages
  blockinfile:
    path: "{{ homeassistant_dir }}/config/configuration.yaml"
    marker: "# {mark} ANSIBLE MANAGED: packages"
    block: |
      homeassistant:
        packages: !include_dir_named packages
  become: true
  notify: homeassistant | restart
  tags: homeassistant

- name: homeassistant | devworkstation power sensors
  copy:
    src: devworkstation_power.yaml
    dest: "{{ homeassistant_dir }}/config/packages/devworkstation_power.yaml"
    mode: "0644"
  become: true
  notify: homeassistant | restart
  tags: homeassistant

- name: homeassistant | gpu power export script
  copy:
    src: ha-gpu-power
    dest: /usr/local/bin/ha-gpu-power
    mode: "0755"
  become: true
  notify: homeassistant | restart gpu power export
  tags: homeassistant

- name: homeassistant | gpu power export service
  template:
    src: ha-gpu-power.service.j2
    dest: /etc/systemd/system/ha-gpu-power.service
    mode: "0644"
  become: true
  notify: homeassistant | restart gpu power export
  tags: homeassistant

- name: homeassistant | gpu power export running
  systemd:
    name: ha-gpu-power
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: homeassistant

- name: homeassistant | container up
  community.docker.docker_compose_v2:
    project_src: "{{ homeassistant_dir }}"
    state: present
    pull: missing
  become: true
  tags: homeassistant
