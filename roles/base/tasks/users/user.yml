- name: users | create group
  tags: groups,users
  become: yes
  check_mode: no
  group:
    name: "{{ username }}"
    state: present

- name: users | create user
  tags: sudo,users
  become: yes
  user:
    name: "{{ username }}"
    group: "{{ username }}"
    groups: "{{ username }},staff,{{ sudo_group | default('admin') }}"
    state: present
    comment: "user"
    shell: /bin/zsh

- name: users | create .ssh directory
  tags: dotfiles,ssh,users
  file:
    path: "{{ item.dir }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: 0700
  with_items:
    - { dir: "{{ userhome }}/.ssh" }

- name: users | copy config directory
  copy:
    src: "{{ item }}"
    dest: "{{ userhome }}/.config/git/"
    owner: "{{ username }}"
    group: "{{ username }}"
  with_items:
    ["users/{{ username }}/config/git/.gitconfig-personal", "users/{{ username }}/config/git/.gitconfig-hero", "users/{{ username }}/config/git/.gitconfig-company" ]

- name: Dotfiles - Clone z-zsh
  stat:
    path: "{{ userhome }}/z-zsh"
  register: subrepo_directory
  check_mode: no
  tags: dotfiles,users,submodules
- name: Git | Checkout z-zsh repository
  become_user: "{{ username }}"
  git:
    repo: "https://github.com/sjl/z-zsh.git"
    dest: "{{ userhome }}/z-zsh"
  when: not subrepo_directory.stat.exists
  tags: dotfiles,users,submodules

- name: Dotfiles - Clone .vim
  stat:
    path: "{{ userhome }}/.vim"
  register: subrepo_directory
  check_mode: no
  tags: dotfiles,users,submodules
- name: Git | Checkout .vim repository
  become_user: "{{ username }}"
  git:
    repo: "https://github.com/homeofficehost/.vim.git"
    dest: "{{ userhome }}/.vim"
    update: yes
    track_submodules: yes
    recursive: yes
  when: not subrepo_directory.stat.exists
  tags: dotfiles,users,submodules

- name: Dotfiles - Clone .oh-my-zsh
  stat:
    path: "{{ userhome }}/.oh-my-zsh"
  register: subrepo_directory
  check_mode: no
  tags: dotfiles,users,submodules
- name: Git | Checkout .oh-my-zsh repository
  become_user: "{{ username }}"
  git:
    repo: "https://github.com/robbyrussell/oh-my-zsh.git"
    dest: "{{ userhome }}/.oh-my-zsh"
  when: not subrepo_directory.stat.exists
  tags: dotfiles,users,submodules

- name: Dotfiles - Clone .oh-my-zsh-custom
  stat:
    path: "{{ userhome }}/.oh-my-zsh-custom"
  register: subrepo_directory
  check_mode: no
  tags: dotfiles,users,submodules
- name: Git | Checkout .oh-my-zsh-custom repository
  become_user: "{{ username }}"
  git:
    repo: "https://github.com/homeofficehost/oh-my-zsh-custom.git"
    dest: "{{ userhome }}/.oh-my-zsh-custom"
    update: yes
    track_submodules: yes
    recursive: yes
  when: not subrepo_directory.stat.exists
  tags: dotfiles,users,submodules

- name: Dotfiles - Clone personal site
  stat:
    path: "{{ userhome }}/site"
  register: subrepo_directory
  check_mode: no
  when: site_upstream is defined and site_upstream | length > 0
  tags: dotfiles,users,submodules
- name: Git | Clone personal
  become_user: "{{ username }}"
  git:
    repo: "{{ site_upstream }}"
    dest: "{{ userhome }}/site"
    update: yes
    track_submodules: yes
    recursive: yes
  when: site_upstream is defined and site_upstream | length > 0 and not subrepo_directory.stat.exists
  tags: dotfiles,users,submodules

- name: Dotfiles | Check if dotfiles bare repo exists
  stat:
    path: "{{ userhome }}/.dotfiles-bare"
  register: dotfiles_bare_directory
  check_mode: no
  tags: dotfiles,users,personal

- name: Dotfiles | Clone dotfiles repository as bare repo
  become_user: "{{ username }}"
  git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ userhome }}/.dotfiles-bare"
    version: "main"
    bare: yes
    recursive: yes
  when: not dotfiles_bare_directory.stat.exists
  tags: dotfiles,users,personal

- name: Dotfiles | Configure bare repo
  become_user: "{{ username }}"
  command: "git --git-dir={{ userhome }}/.dotfiles-bare config core.bare true"
  when: not dotfiles_bare_directory.stat.exists
  tags: dotfiles,users,personal

- name: Dotfiles | Checkout dotfiles files to home
  become_user: "{{ username }}"
  command: "git --git-dir={{ userhome }}/.dotfiles-bare --work-tree={{ userhome }} checkout"
  when: not dotfiles_bare_directory.stat.exists
  tags: dotfiles,users,personal

- name: Dotfiles | Ensure untracked files are hidden
  become_user: "{{ username }}"
  command: "git --git-dir={{ userhome }}/.dotfiles-bare --work-tree={{ userhome }} config status.showUntrackedFiles no"
  tags: dotfiles,users,personal
  changed_when: false

- name: Dotfiles | Pull updates from bare repo
  become_user: "{{ username }}"
  command: "git --git-dir={{ userhome }}/.dotfiles-bare --work-tree={{ userhome }} pull"
  when: dotfiles_bare_directory.stat.exists
  tags: dotfiles,users,personal
  ignore_errors: yes
  changed_when: false

- name: Shell | Ensure ~/.zprofile sources ~/.profile
  lineinfile:
    path: "{{ userhome }}/.zprofile"
    line: '[ -f ~/.profile ] && source ~/.profile'
    insertafter: EOF
    create: yes
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0644'
  tags: shell,users,zprofile

- name: Shell | Ensure GPG homedir has correct permissions
  file:
    path: "{{ userhome }}/.gnupg"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0700'
  tags: shell,users,gpg

- name: Shell | Ensure Bitwarden config directory exists
  file:
    path: "{{ userhome }}/.bwconfig/gpg"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0700'
  tags: shell,users,bitwarden

- name: Shell | Ensure Bitwarden GPG symlink is configured
  file:
    src: "{{ userhome }}/.gnupg/pubring.kbx"
    dest: "{{ userhome }}/.bwconfig/gpg/pubring.kbx"
    state: link
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0700'
  tags: shell,users,bitwarden

- name: Dotfiles | Mark provision as changed
  set_fact:
    provision_changed: true
  when: not dotfiles_bare_directory.stat.exists
  tags: dotfiles,users,personal
